<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ course.name }} Exam</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-5"><h1>{{ course.name }} Exam</h1>
<form method="post">{% csrf_token %}
{% for question in questions %}<section class="card mb-3"><div class="card-body"><h2 class="h5">{{ forloop.counter }}. {{ question.text }}</h2>
{% for choice in question.choices.all %}<div class="form-check"><input class="form-check-input" type="radio" name="question_{{ question.id }}" id="choice{{ choice.id }}" value="{{ choice.id }}"><label class="form-check-label" for="choice{{ choice.id }}">{{ choice.text }}</label></div>{% endfor %}
</div></section>{% empty %}<p>No questions have been added.</p>{% endfor %}
<button class="btn btn-primary" type="submit">Submit exam</button></form></main></body></html>
