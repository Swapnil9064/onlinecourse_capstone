<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exam Result</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-5"><div class="card shadow-sm"><div class="card-body text-center">
{% if passed %}<h1 class="text-success">Congratulations!</h1>{% else %}<h1>Exam Results</h1>{% endif %}
<p class="lead">Your score: {{ score }} / {{ total }}</p>
<p>{% if passed %}Successful attempt!{% else %}Review the lessons and try again.{% endif %}</p>
<a class="btn btn-primary" href="{% url 'onlinecourse:course_details' course.id %}">Back to course</a>
</div></div></main></body></html>
